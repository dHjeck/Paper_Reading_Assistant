<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Reading Assistant</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        width: 280px;
        background: #f7efe5;
        color: #2f2418;
        font: 14px/1.4 Georgia, "Times New Roman", serif;
      }

      button {
        width: 100%;
        margin-top: 10px;
        border: 0;
        border-radius: 999px;
        padding: 10px 12px;
        background: #a85a22;
        color: #fffaf2;
        cursor: pointer;
        font: inherit;
      }

      #status {
        min-height: 18px;
        margin-top: 10px;
        color: #9a3324;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <strong>Paper Reading Assistant</strong>
    <p>Open the side panel and start selecting paper text or figures.</p>
    <button id="open-side-panel">Open Side Panel</button>
    <button id="open-pdf-workspace">Open PDF Workspace</button>
    <button id="refresh-current-tab">Refresh Current Tab Context</button>
    <button id="reload-current-page">Reload Current Page</button>
    <button id="open-settings">Open Settings</button>
    <div id="status" aria-live="polite"></div>
    <script src="../shared/contracts.js"></script>
    <script src="./popup.js"></script>
  </body>
  </html>
